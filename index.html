<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kailash AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <span>☰</span>
  <h2>🤖 Kailash AI</h2>
  <span>✏️</span>
</div>

<div id="response" class="chat-container"></div>

  <div id="imagePreview"></div>

  <div id="pdfPreview"></div>
  
<button id="removeImageBtn" hidden>❌ Remove</button>

<div class="input-area">  <input
    type="text"
    id="prompt"
    placeholder="Message Kailash AI..."
  >
 
  <input type="file" id="imageInput" accept="image/*" hidden>

<button id="imageBtn">📎</button>
<input type="file" id="pdfInput" accept=".pdf" hidden>

<button id="pdfBtn">📄</button>

  <button onclick="sendMessage()">➤</button>
<button id="micBtn">🎤</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
  <script src="script.js"></script>

</html>
